name: polaris
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            max-jobs = 2
            cores = 2
      - run: sudo apt-get update && sudo apt-get install -y mtools dosfstools file
      - run: nix build github:dianqk/nixos-android-devices#devices.polaris.minimal.rootfs --out-link out/rootfs -L
      - run: nix build github:dianqk/nixos-android-devices#devices.polaris.minimal.boot-files --out-link out/boot-files -L
      - run: nix build github:dianqk/nixos-android-devices#devices.polaris.u-boot --out-link out/u-boot -L
      - run: ls -la out/rootfs out/boot-files out/u-boot && file out/rootfs out/u-boot
      - run: chmod +x package.sh && ./package.sh out/rootfs out/boot-files out/u-boot nixos-polaris-twrp.zip
      - uses: actions/upload-artifact@v4
        with:
          name: nixos-polaris-twrp-zip
          path: nixos-polaris-twrp.zip
